snapshot:
  name: snapshot
  parent: root
  help: create and restore from backups

snapshot_create:
  name: create
  script: snapshot_create
  parent: snapshot
  args:
    - name:
        - --zip
      action: store_true
      help: Generate zip file
    - name:
        - --s3
      action: store_true
      help: Upload to or Download from s3
    - name:
        - -f
        - --filename
      help:
        File to store to (default backup.zip)
      default: backup.zip


snapshot_restore:
  name: restore
  parent: snapshot
  script: snapshot_restore
  args:
    - name:
        - --dl
      help: Download from link then restore
    - name:
        - --s3
      action: store_true
      help: Upload to or Download from s3
    - name:
        - -f
        - --filename
      help:
        File to restore from (default "backup.zip", default if not s3)
      default: backup.zip
